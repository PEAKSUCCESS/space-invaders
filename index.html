<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800&family=Montserrat:wght@400;500;600;700&display=swap"
    />
    <title>Space</title>
    <style>
      /* Paint the navy ground AND the JIFU header on the first frame —
         the header is part of the static shell (below) so it never flashes in.
         #002B6B is peak-navy-alt, the ground every screen in the peak-esl demo
         sits on; #03184D is peak-dark-gray, its header. */
      html, body { background: #002B6B; }
      :root { --peak-header-h: 56px; }
      .peak-header-root { height: var(--peak-header-h); }
      /* Embedded (?embedded=1): the host page supplies its own chrome, so drop
         ours entirely — the class is set by the head script below, before the
         first paint, so the header never flashes in and back out. */
      html.peak-embedded { --peak-header-h: 0px; }
      html.peak-embedded .peak-header-root { display: none; }
      .peak-header {
        position: fixed; top: 0; left: 0; width: 100%; height: 56px; z-index: 60;
        box-sizing: border-box; background: #03184D; display: flex; align-items: center;
        gap: 40px; padding: 12px; color: #fff;
        font-family: 'DM Sans', 'Montserrat', system-ui, -apple-system, sans-serif;
      }
      .peak-header-logo { display: block; width: 76px; height: auto; flex-shrink: 0; }
      .peak-header-nav { display: flex; align-items: center; width: 100%; }
      .peak-header-links, .peak-header-right { display: flex; align-items: center; gap: 32px; margin: 0; padding: 0; list-style: none; }
      .peak-header-right { margin-left: auto; flex-shrink: 0; }
      .peak-header-item { white-space: nowrap; }
      .peak-header-link, .peak-header-name { font-size: 14px; font-weight: 700; color: #fff; cursor: default; text-decoration: none; }
      a.peak-header-link.is-clickable { cursor: pointer; }
    </style>
    <script>
      // Runs while <head> parses — before the header markup below is painted —
      // so ?embedded=1 hides the JIFU bar with no flash. The hub forwards
      // this param to every activity (buildLaunchUrl in its games.ts).
      if (new URLSearchParams(location.search).get('embedded') === '1') {
        document.documentElement.classList.add('peak-embedded');
      }
    </script>
  </head>
  <body>
    <!-- Static JIFU header: part of the shell so it paints on the first frame
         and never flashes. The app renders into #root below it. -->
    <div class="peak-header-root">
      <header class="peak-header">
        <img class="peak-header-logo" src="/peak_logo.png" alt="JIFU logo" />
        <nav class="peak-header-nav">
          <ul class="peak-header-links">
            <li class="peak-header-item"><a id="peak-header-home" class="peak-header-link is-clickable" href="https://app.peakesl.com" onclick="if (history.length > 2) { history.go(-2); return false; }">Home</a></li>
            <li class="peak-header-item"><a id="peak-header-vocab" class="peak-header-link is-clickable" onclick="history.back(); return false;">Vocabulary</a></li>
          </ul>
          <ul class="peak-header-right">
            <li class="peak-header-item"><span class="peak-header-name" id="peak-header-name"></span></li>
          </ul>
        </nav>
      </header>
    </div>
    <script>
      (function () {
        var p = new URLSearchParams(location.search);
        var n = (p.get('shopperName') || p.get('userName') || p.get('name') || '').trim();
        if (n) document.getElementById('peak-header-name').textContent = n;
        // Native-language header labels (mirrors ui_strings; es only today). English
        // stays the default in the markup, so untranslated languages don't flash.
        var T = { es: { home: 'Inicio', vocab: 'Vocabulario' } };
        var tr = T[(p.get('language') || p.get('nativeLanguage') || '').toLowerCase()];
        if (tr) {
          var h = document.getElementById('peak-header-home'); if (h) h.textContent = tr.home;
          var v = document.getElementById('peak-header-vocab'); if (v) v.textContent = tr.vocab;
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
